<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="quizContainer">
      <h1 id="quizTitle">Welcome</h1>
      <hr class="line" />
      
      <div class="yo">
        <h2 id="questionText">Questions:</h2>
      </div>

      <div class="answers" id="answerContainer">
        <div class="op1" id="option1">ANSWER 1</div>
        <div class="op1" id="option2">ANSWER 2</div>
        <div class="op1" id="option3">ANSWER 3</div>
        <div class="op1" id="option4">ANSWER 4</div>
      </div>

      <hr class="down" />

      <div class="nextBtn">
        <button id="nextBtn">Next</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
